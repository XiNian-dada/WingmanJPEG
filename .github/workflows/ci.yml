name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: "1.88.0"
          - os: ubuntu-24.04-arm
            rust: stable
          - os: macos-latest
            rust: stable
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
          rustup override set "${{ matrix.rust }}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test native processors
        run: cargo test --locked --release
      - name: Run the README quickstart
        run: cargo run --locked --release --example quickstart
      - name: Check all targets
        run: cargo clippy --locked --release --all-targets -- -D warnings
